<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR pipeline steps</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --accent: #1f5fd1; --ok: #14803c; --bad: #c42b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d222b; --text: #e8ebf0; --muted: #9aa3b2; --line: #2d3440;
            --accent: #6aa0ff; --ok: #4cc47a; --bad: #ff7b7b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: var(--muted); }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center;
          background: var(--card); cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  #drop b { color: var(--accent); }
  #status { margin: 14px 0; color: var(--muted); min-height: 1.5em; }
  #status.err { color: var(--bad); }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin: 14px 0; }
  .step h2 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
  .step .ms { font-size: 12px; color: var(--muted); font-weight: 400; }
  .step p { margin: 0 0 12px; color: var(--muted); }
  .figs { display: flex; flex-wrap: wrap; gap: 14px; }
  figure { margin: 0; flex: 1 1 320px; max-width: 100%; }
  figure img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line);
               background: #000; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tablewrap { overflow-x: auto; margin-top: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  tr.dropped td { color: var(--muted); text-decoration: line-through; }
  .total { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>OCR pipeline, step by step</h1>
  <p class="lead">Upload a label photo to see what each step of the OCR service does to it.</p>
  <label id="drop">
    <input id="file" type="file" accept="image/*" hidden>
    <b>Choose a photo</b> or drop one here
  </label>
  <div id="status"></div>
  <div id="steps"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), stepsEl = $("steps");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e[k] = v;
  for (const k of kids) e.append(k);
  return e;
}

function render(data) {
  stepsEl.replaceChildren();
  for (const s of data.steps) {
    const card = el("section", { className: "step" });
    const h = el("h2", {}, s.title);
    if (s.ms !== null) h.append(el("span", { className: "ms" }, `${s.ms} ms`));
    card.append(h, el("p", {}, s.note));
    if (s.images.length) {
      const figs = el("div", { className: "figs" });
      for (const im of s.images) {
        figs.append(el("figure", {}, el("img", { src: im.src, alt: im.label }),
                       el("figcaption", {}, im.label)));
      }
      card.append(figs);
    }
    if (s.table && s.table.rows.length) {
      const t = el("table");
      t.append(el("thead", {}, el("tr", {}, ...s.table.headers.map((c) => el("th", {}, c)))));
      const body = el("tbody");
      for (const row of s.table.rows) {
        const tr = el("tr", row.some((c) => String(c).startsWith("no (")) ? { className: "dropped" } : {});
        for (const c of row) tr.append(el("td", {}, c === null || c === "" ? "—" : String(c)));
        body.append(tr);
      }
      t.append(body);
      card.append(el("div", { className: "tablewrap" }, t));
    }
    stepsEl.append(card);
  }
  statusEl.className = "total";
  statusEl.textContent = `Done in ${data.total_ms} ms (includes drawing the pictures).`;
}

async function run(file) {
  if (!file) return;
  statusEl.className = "";
  statusEl.textContent = "Reading the label…";
  stepsEl.replaceChildren();
  const body = new FormData();
  body.append("image", file);
  try {
    const res = await fetch("/v1/debug", { method: "POST", body });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    render(await res.json());
  } catch (e) {
    statusEl.className = "err";
    statusEl.textContent = `Failed: ${e.message}`;
  }
}

$("file").addEventListener("change", (e) => run(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => {
  e.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", (e) => run(e.dataTransfer.files[0]));
</script>
</body>
</html>
