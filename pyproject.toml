[project]
name = "tma-ocr"
version = "0.1.0"
description = "OCR service for Thai/English parcel waybills (plain PaddleOCR, no VLM)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "opencv-python-headless>=4.10,<5",
    "zxing-cpp>=2.3",
    "paddleocr==3.7.0",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
]
# paddlepaddle itself is installed by the Dockerfile (CPU or CUDA wheel, pinned to 3.2.2).

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) default
