# Carrier rules for v1 field extraction (rule-based KIE).
#
# `keywords` are matched case-insensitively against OCR lines.
# `tracking_patterns` are full-match regexes applied to normalized tracking candidates
# (uppercase, no spaces/dashes). Only Thailand Post's UPU S10 format is filled in; the rest
# MUST come from the week-1 label survey — do not guess formats, a wrong regex silently
# routes good labels to review or, worse, accepts the wrong number.

carriers:
  thailand_post:
    display: Thailand Post
    keywords: ["ไปรษณีย์ไทย", "thailand post", "thaipost", "ems"]
    tracking_patterns: ['[A-Z]{2}\d{9}TH']
  flash:
    display: Flash Express
    keywords: ["flash express", "แฟลช"]
    tracking_patterns: []
  kex:
    display: KEX (Kerry Express)
    keywords: ["kex", "kerry express", "เคอรี่"]
    tracking_patterns: []
  jt:
    display: J&T Express
    keywords: ["j&t", "j&t express"]
    tracking_patterns: []
  spx:
    display: Shopee Express (SPX)
    keywords: ["spx", "shopee express", "shopee"]
    tracking_patterns: []
  lex:
    display: Lazada Express (LEX)
    keywords: ["lex", "lazada"]
    tracking_patterns: []
  ninjavan:
    display: Ninja Van
    keywords: ["ninja van", "ninjavan"]
    tracking_patterns: []
  dhl:
    display: DHL
    keywords: ["dhl"]
    tracking_patterns: []

# Anchors that introduce the recipient block (the sender block must never be read as recipient).
recipient_anchors: ["ผู้รับ", "ชื่อผู้รับ", "ถึง", "to:", "to", "receiver", "recipient", "ship to", "deliver to"]
sender_anchors: ["ผู้ส่ง", "ชื่อผู้ส่ง", "จาก", "from:", "from", "sender", "return address"]
unit_anchors: ["ห้อง", "ห้องเลขที่", "เลขที่", "room", "unit", "apt", "no."]
