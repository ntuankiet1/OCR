# Smartworld Parcel OCR — on-prem training stack.
#
#   docker compose up -d                      # infra: postgres, seaweedfs (S3), mlflow, label-studio
#   docker compose run --rm pipeline <cmd>    # snapshot / calibrate / evaluate / gate / registry
#   docker compose --profile train run --rm train <cmd>   # fine-tuning (linux/amd64)
#   docker compose --profile test run --rm test           # test suite
#
# Nothing in this stack calls an external AI service (BRD §3, §9). The only outbound traffic is
# image/wheel pulls at build time and the one-off base-model download (`fetch-base-models`).

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL_S3: http://seaweedfs:8333
  MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333

x-app-env: &app-env
  <<: *s3-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  PARCEL_OCR_S3_ENDPOINT_URL: http://seaweedfs:8333

x-app: &app
  env_file:
    - path: .env
      required: false
  environment: *app-env
  working_dir: /app
  volumes:
    - ./:/app            # repo (code, dvc.yaml, params.yaml, data/) — editable install picks up src/
  depends_on:
    init:
      condition: service_completed_successfully
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 20

  # S3-compatible object storage (MinIO CE is archived and no longer ships images).
  # Buckets: parcel-images (content-addressed label images), dvc-store, mlflow-artifacts.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"admin",
          "credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],
          "actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 30

  mlflow:
    build: docker/mlflow
    image: parcel-ocr/mlflow:3.17.1
    restart: unless-stopped
    environment:
      <<: *s3-env
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow-artifacts
      - --serve-artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5000}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      retries: 30

  label-studio:
    image: heartexlabs/label-studio:1.23.2
    restart: unless-stopped
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:?set in .env}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?set in .env}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    volumes:
      - labelstudio-data:/label-studio/data
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: create buckets (idempotent).
  init:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: core
    image: parcel-ocr/core:latest
    environment: *app-env
    command: ["parcel-ocr", "infra", "init-buckets"]
    depends_on:
      seaweedfs:
        condition: service_healthy

  pipeline:
    <<: *app
    image: parcel-ocr/core:latest
    profiles: ["tools"]
    command: ["parcel-ocr", "--help"]

  train:
    <<: *app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: train
      args:
        TRAIN_VARIANT: ${TRAIN_VARIANT:-cpu}
    image: parcel-ocr/train:${TRAIN_VARIANT:-cpu}
    platform: ${TRAIN_PLATFORM:-linux/amd64}
    profiles: ["train"]
    shm_size: "8gb"      # paddle / torch dataloader workers
    command: ["parcel-ocr", "--help"]

  # JupyterLab on the train image — notebooks/ (e.g. the ThaiOCRBench notebook).
  #   make notebook   → http://127.0.0.1:8888/lab?token=$NOTEBOOK_TOKEN
  notebook:
    <<: *app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: notebook
      args:
        TRAIN_VARIANT: ${TRAIN_VARIANT:-cpu}
    image: parcel-ocr/notebook:${TRAIN_VARIANT:-cpu}
    platform: ${TRAIN_PLATFORM:-linux/amd64}
    profiles: ["notebook"]
    shm_size: "8gb"
    ports:
      - "127.0.0.1:${NOTEBOOK_PORT:-8888}:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/app
      - --IdentityProvider.token=${NOTEBOOK_TOKEN:-parcel-ocr}

  test:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: test
    image: parcel-ocr/test:latest
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./configs:/app/configs
      - ./params.yaml:/app/params.yaml
    command: ["pytest"]

volumes:
  postgres-data:
  seaweedfs-data:
  labelstudio-data:
