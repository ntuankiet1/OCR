services:
  ocr:
    build:
      context: .
      args:
        PADDLE: ${PADDLE:-cpu}   # cpu | gpu
    image: tma-ocr:${PADDLE:-cpu}
    env_file:
      - path: .env
        required: false
    environment:
      OCR_DETECTOR: /models/shipping-label-detector.onnx   # ignored when the file is missing
    volumes:
      - ./models:/models:ro
    ports:
      - "${OCR_PORT:-8000}:8000"
    restart: unless-stopped
